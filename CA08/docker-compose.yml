version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: mio-mysql
    restart: always
    environment:
      MYSQL_DATABASE: mio_book_db
      MYSQL_ROOT_PASSWORD: 1234
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - mio-network

  backend:
    ## build: from Dockerfile
    # build:
    #   context: ./back-end/mio-book
    # image: mio-backend

    #build: from dockerhub image
    image: masoudmora/ie4032ca8:backend
    
    container_name: mio-backend
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/mio_book_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1234
    networks:
      - mio-network

  frontend:

    ## build: from Dockerfile
    # build:
    #   context: ./front-end/mio-book
    # image: mio-frontend

    #build: from dockerhub image
    image: masoudmora/ie4032ca8:frontend


    container_name: mio-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5555:3000"
    # environment:
    #   BACKEND_HOST: mio-backend
    #   BACKEND_PORT: 8080
    networks:
      - mio-network

volumes:
  mysql-data:

networks:
  mio-network:
    driver: bridge