version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: mio-mysql
    restart: always
    environment:
      MYSQL_DATABASE: mio_book_db
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - mio-network
    secrets:
      - mysql_root_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$(cat /run/secrets/mysql_root_password)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: masoudmora/ie4032ca8:backend
    container_name: mio-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/mio_book_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
    secrets:
      - mysql_root_password
    networks:
      - mio-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: masoudmora/ie4032ca8:frontend
    container_name: mio-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5555:3000"
    networks:
      - mio-network

volumes:
  mysql-data:

networks:
  mio-network:
    driver: bridge

secrets:
  mysql_root_password:
    file: ./mysql_root_password.txt