version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: mio-mysql
    restart: always
    environment:
      MYSQL_DATABASE: mio_book_db
      MYSQL_ROOT_PASSWORD: 1234
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - mio-network

  backend:
    build:
      context: ./backend
    image: mio-backend
    container_name: mio-backend
    depends_on:
      - db
    ports:
      - "8080:8080" 
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/mio_book_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1234
    networks:
      - mio-network

  frontend:
    build:
      context: ./frontend
    image: mio-frontend
    container_name: mio-frontend
    depends_on:
      - backend
    ports:
      - "5555:3000" 
    networks:
      - mio-network

volumes:
  mysql-data:

networks:
  mio-network:
    driver: bridge