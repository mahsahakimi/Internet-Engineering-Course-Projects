<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User2</title>
    <link rel="stylesheet" href="../stylesheets/bootstrap-5.3.3-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../stylesheets/users.css">
    <link rel="stylesheet" href="../stylesheets/style.css">
</head>
<body>
    <nav class="navbar bg-white shadow-sm mb-5 ">
        <div class="container-fluid d-flex align-items-center justify-content-between max-height-nav">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <div class="logo-container max-height-nav ms-5">
                    <img src="../images/LOGO.png" alt="Meow Logo" class="logo-cover">
                </div>
            </a>
            <div class="search-container max-height-nav d-flex w-50">
                <div class="dropdown max-height-nav col-md-2">
                    <button class="btn dropdown-toggle max-height-nav" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                        Author
                    </button>
                    <ul class="dropdown-menu max-height-nav" aria-labelledby="dropdownMenuButton">
                        <li><a class="dropdown-item" href="#">Author</a></li>
                        <li><a class="dropdown-item" href="#">Title</a></li>
                        <li><a class="dropdown-item" href="#">Publisher</a></li>
                    </ul>
                </div>
                <div class="border-start mx-3 "></div>
                <input type="text" class="form-control search-box max-height-nav" placeholder="Search">
            </div>

            <button class="btn green-btn max-height-nav">Buy now</button>
        </div>
    </nav>
    <div class="container">
        <div class="top-box row">
            <div class="account-box col-md-8">
                <div class="m-3"><h3>$1,000</h3></div>
                <div class="d-flex">
                    <input type="text" class="form-control me-2" placeholder="$Amount">
                    <button class="btn medium-btn green-btn">Add more credit</button>
                </div>
            </div>
            <div class="col"></div>
            <div class="user-info col-md-3">
                <p><strong>👤 SanaNavaei</strong></p>
                <p>📧 sana.sarinavaei@gmail.com</p>
                <button class="btn gray-btn small-btn">logout</button>
            </div>
        </div>

        <div class="container py-5">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="icon" viewBox="0 0 16 16">
                            <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5z"/>
                            <path d="M3.102 4l1.313 7h8.17l1.313-7H3.102zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                        </svg>
                        Cart
                    </h5>
                </div>
                <div class="empty-state">
                    <svg class="empty-illustration" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="100" cy="100" r="80" fill="#f5f5f5"/>
                        <path d="M50 70 L60 100 L140 100 L150 70 Z" stroke="#e0e0e0" stroke-width="2" fill="none"/>
                        <path d="M60 100 L70 130 L130 130 L140 100" stroke="#e0e0e0" stroke-width="2" fill="none"/>
                        <circle cx="80" cy="140" r="10" stroke="#e0e0e0" stroke-width="2" fill="white"/>
                        <circle cx="120" cy="140" r="10" stroke="#e0e0e0" stroke-width="2" fill="white"/>
                        <path d="M90 80 C90 85, 110 85, 110 80" stroke="#e0e0e0" stroke-width="2" fill="none" transform="rotate(180, 100, 85)"/>
                        <circle cx="85" cy="75" r="2" fill="#e0e0e0"/>
                        <circle cx="115" cy="75" r="2" fill="#e0e0e0"/>
                        <path d="M40 50 L50 50 M45 45 L45 55" stroke="#e0e0e0" stroke-width="2"/>
                        <path d="M150 40 L160 40 M155 35 L155 45" stroke="#e0e0e0" stroke-width="2"/>
                        <path d="M170 90 L180 90 M175 85 L175 95" stroke="#e0e0e0" stroke-width="2"/>
                    </svg>
                    <p class="empty-message">No Product</p>
                </div>
            </div>

            <!-- History Section -->
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">
                        <!-- History Icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="icon" viewBox="0 0 16 16">
                            <path d="M8 3.5a.5.5 0 0 0-1 0V9a.5.5 0 0 0 .252.434l3.5 2a.5.5 0 0 0 .496-.868L8 8.71V3.5z"/>
                            <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm7-8A7 7 0 1 1 1 8a7 7 0 0 1 14 0z"/>
                        </svg>
                        History
                    </h5>
                </div>
                <div class="empty-state">
                    <svg class="empty-illustration" viewBox="0 0 200 200" xmlns="">
                        <circle cx="100" cy="100" r="80" fill="#f5f5f5"/>
                        <path d="M50 70 L80 70 L90 80 L150 80 L150 130 L50 130 Z" stroke="#e0e0e0" stroke-width="2" fill="white"/>
                        <circle cx="130" cy="115" r="25" stroke="#e0e0e0" stroke-width="2" fill="none"/>
                        <line x1="150" y1="135" x2="165" y2="150" stroke="#e0e0e0" stroke-width="4" stroke-linecap="round"/>
                        <path d="M40 50 L50 50 M45 45 L45 55" stroke="#e0e0e0" stroke-width="2"/>
                        <path d="M150 40 L160 40 M155 35 L155 45" stroke="#e0e0e0" stroke-width="2"/>
                        <path d="M170 90 L180 90 M175 85 L175 95" stroke="#e0e0e0" stroke-width="2"/>
                    </svg>
                    <p class="empty-message">No Result</p>
                </div>
            </div>
        </div>
    </div>

    <footer class="w-100">
        <p class="text-center">Copyright © 2025 - MioBook</p>
    </footer>
</body>
</html>
