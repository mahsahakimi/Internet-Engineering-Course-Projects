<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../stylesheets/style.css">
    <title>Sign Up</title>
    <link rel="stylesheet" href="../stylesheets/bootstrap-5.3.3-dist/css/bootstrap.min.css">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <h2 class="text-center">Sign Up</h2>
            <p class="text-center text-muted">MioBook</p>

            <form>
                <input type="text" class="form-control mb-3" placeholder="Username"  >
                <input type="password" class="form-control mb-3" placeholder="Password"  >
                <input type="email" class="form-control mb-3" placeholder="Email"  >

                <div class="row">
                    <div class="col">
                        <input type="text" class="form-control mb-3" placeholder="Country"  >
                    </div>
                    <div class="col">
                        <input type="text" class="form-control mb-3" placeholder="City"  >
                    </div>
                </div>

                <p>I am</p>
                <div class="d-flex justify-content-between mb-3">
                    <button type="button" class="btn btn-outline-dark flex-grow-1 me-2">Customer</button>
                    <button type="button" class="btn btn-outline-secondary flex-grow-1">Manager</button>
                </div>

                <button type="submit" class="btn btn-dark w-100" disabled>Sign up</button>
            </form>

            <p class="text-center mt-3">Already have an account? <a href="#">Sign in</a></p>
        </div>
    </div>
</div>

<footer class="text-center text-white py-3">
    <p>Copyright © 2025 - MioBook</p>
</footer>

</body>
</html>
