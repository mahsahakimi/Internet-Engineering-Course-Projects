<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../stylesheets/bootstrap-5.3.3-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../stylesheets/style.css">
    <link rel="stylesheet" href="../stylesheets/signup.css">

    <title>Sign In</title>

</head>


<body class="d-flex justify-content-center align-items-center ">
<div class="sign container">
    <h2 class="text-center">Sign In</h2>
    <p class="subtitle text-center mb-5">MioBook</p>
    <form action="#" method="POST" class="w-100">
        <div class="mb-3">
            <input type="text" class="form-control" name="username" placeholder="Username" >
        </div>
        <div class="mb-3">
            <input type="text" class="form-control" name="password" placeholder="Password" >
        </div>

        <button type="submit" class="btn btn-light w-100 mb-3"><strong>Sign in</strong></button>
    </form>
    <p class="signin-link text-center ">Not a member yet? <a href="#"><strong>Sign up</strong></a></p>
</div>

<footer class="w-100">
    <p class="text-center">Copyright © 2025 - MioBook</p>
</footer>

</body>
</html>
