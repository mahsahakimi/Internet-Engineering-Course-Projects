spring.application.name=mio-book
server.servlet.context-path=/api

# Development
# Making the generated SQL statements in the console output more readable
spring.jpa.properties.hibernate.format_sql=true
# Log all generated SQL statements to the console
spring.jpa.show-sql=true

# for develop "create-drop" and for production env "update"
spring.jpa.hibernate.ddl-auto=create-drop

# complete for use
spring.datasource.username=postgres
spring.datasource.password=3611

# for PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/mio-book-db
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# spring.datasource.driver-class-name=org.postgresql.Driver
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect