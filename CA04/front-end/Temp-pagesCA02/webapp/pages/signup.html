<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../stylesheets/bootstrap-5.3.3-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../stylesheets/style.css">
    <link rel="stylesheet" href="../stylesheets/signup.css">

    <title>Sign Up</title>

</head>


<body class="justify-content-center">
    <div class = "row"> "" </div>
    <div class="row">
        <div class="container col-sm-6">
            <h2 class="text-center">Sign Up</h2>
            <p class="subtitle text-center mb-5">MioBook</p>
            <div class="row justify-content-center">
                <form id="signupForm" action="#" method="POST" class="col-10 col-sm-8">
                    <div class="mb-3">
                        <input type="text" class="form-control" name="username" placeholder="Username" >
                    </div>
                    <div class="mb-3">
                        <input type="text" class="form-control" name="password" placeholder="Password" >
                    </div>
                    <div class="mb-3">
                        <input type="email" class="form-control" name="email" placeholder="Email" >
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <input type="text" class="form-control" name="country" placeholder="Country" >
                        </div>
                        <div class="col">
                            <input type="text" class="form-control" name="city" placeholder="City" >
                        </div>
                    </div>
                    <label>I am</label>
                    <div class="row mb-3 mt-3">
                        <div class="col-6">
                            <button type="button" id="btnCustomer" class="btn role-btn selected col-12 ">
                                <i class=""></i> Customer
                            </button>
                        </div>
                        <div class="col-6">
                            <button type="button" id="btnManager" class="btn role-btn col-12">
                                <i class=""></i> Manager
                            </button>
                        </div>

                    </div>
                    <button type="submit" id="signupBtn" class="btn sign-btn mb-3 col-12"><strong>Sign up</strong></button>
                </form>
            </div>
            <p class="signin-link text-center ">Already have an account? <a href="#"><strong>Sign in</strong></a></p>
    
        </div>
    </div>
    <footer class="col-sm-12">
        <p class="text-center">Copyright © 2025 - MioBook</p>
    </footer>



    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const btnCustomer = document.getElementById('btnCustomer');
            const btnManager = document.getElementById('btnManager');
        
            function toggleRole(selectedBtn, otherBtn) {
                selectedBtn.classList.add('selected');
                otherBtn.classList.remove('selected');
            }
        
            btnCustomer.addEventListener('click', function () {
                toggleRole(btnCustomer, btnManager);
            });
        
            btnManager.addEventListener('click', function () {
                toggleRole(btnManager, btnCustomer);
            });
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('signupForm');
            const inputs = form.querySelectorAll('input');
            const signupBtn = document.getElementById('signupBtn');
        
            function checkInputs() {
                let allFilled = true;
                inputs.forEach(input => {
                    if (input.value.trim() === '') {
                        allFilled = false;
                    }
                });
        
                if (allFilled) {
                    signupBtn.classList.remove('sign-btn');
                    signupBtn.classList.add('green-btn');
                } else {
                    signupBtn.classList.remove('green-btn');
                    signupBtn.classList.add('sign-btn');
                }
            }
        
            inputs.forEach(input => {
                input.addEventListener('input', checkInputs);
            });
        
            checkInputs();
        });
    </script>
        
        
</body>
</html>
