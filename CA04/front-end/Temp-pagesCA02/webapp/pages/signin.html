<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../stylesheets/bootstrap-5.3.3-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../stylesheets/style.css">
    <link rel="stylesheet" href="../stylesheets/signup.css">

    <title>Sign In</title>

</head>


<body class="justify-content-center">
    <div class="row justify-content-center">
        <div class = "col-sm-6 container">
            <h2 class="text-center">Sign In</h2>
        <p class="subtitle text-center mb-5">MioBook</p>
        <div class="row justify-content-center">
            <form action="#" method="POST" class="col-10 col-sm-8">
                <div class="mb-3">
                    <input type="text" class="form-control" name="username" placeholder="Username" >
                </div>
                <div class="mb-3">
                    <input type="text" class="form-control" name="password" placeholder="Password" >
                </div>
                <button type="submit" class="btn gray-btn mb-3 col-sm-12"><strong>Sign in</strong></button>
            </form>
        </div>
        <p class="signin-link text-center ">Not a member yet? <a href="#"><strong>Sign up</strong></a></p>
        </div>
        
    </div>

    <footer class="col-sm-12">
        <p class="text-center">Copyright © 2025 - MioBook</p>
    </footer>

    <script>
        const usernameInput = document.querySelector('input[name="username"]');
        const passwordInput = document.querySelector('input[name="password"]');
        const signInButton = document.querySelector('button[type="submit"]');
    
        function checkInputs() {
            if (usernameInput.value.trim() && passwordInput.value.trim()) {
                signInButton.classList.remove("sign-btn");
                signInButton.classList.add("green-btn");
            } else {
                signInButton.classList.remove("green-btn");
                signInButton.classList.add("sign-btn");
            }
        }
    
        usernameInput.addEventListener("input", checkInputs);
        passwordInput.addEventListener("input", checkInputs);
    </script>
    
</body>

</html>
