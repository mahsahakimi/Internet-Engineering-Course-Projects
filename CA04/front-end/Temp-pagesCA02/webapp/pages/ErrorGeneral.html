<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something Went Wrong</title>
    <link rel="stylesheet" href="../stylesheets/bootstrap-5.3.3-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../stylesheets/style.css">
    <link rel="stylesheet" href="../stylesheets/ErrorGeneral.css">

</head>
<body>
    <nav class="navbar bg-white shadow-sm mb-5 ">
        <div class="container-fluid d-flex">
            <a class="navbar-brand d-flex" href="#">
                <div class="logo-container ms-5">
                    <img src="../images/LOGO.png" alt="Meow Logo" class="logo-cover">
                </div>
            </a>
            <div class="search-container d-flex col-6">
                <div class="dropdown">
                    <button class="btn dropdown-toggle" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                        Author
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                        <li><a class="dropdown-item" href="#">Author</a></li>
                        <li><a class="dropdown-item" href="#">Title</a></li>
                        <li><a class="dropdown-item" href="#">Publisher</a></li>
                    </ul>
                </div>
                <div class="border-start mx-3"></div>
                <input type="text" class="form-control search-box" placeholder="Search">
            </div>
            <button class="btn green-btn ">Buy now</button>
        </div>
    </nav>


<div class="main-content p-2 mb-2 d-flex align-items-center justify-content-center">
    <div class="error-container w-70 d-flex">
        <div class="error-illustration d-flex align-items-center justify-content-center">
            <h2>Oops!</h2>
            <p>We seem to have lost this page.</p>
        </div>
        <div class="error-details p-5 ">
            <span class="medium-btn gray-btn p-1">Error 500</span>
            <h1>Server Error</h1>
            <p>Something unexpected happened on our end.</p>
            <div class="error-message p-2 mb-5 d-flex justify-content-center">
                Internal Server Error: The server encountered an unexpected condition.
            </div>
            <div class="d-flex justify-content-center">
                <a href="/" class="medium-btn green-btn btn">Return Home</a>
            </div>
        </div>
    </div>
</div>
<footer class="w-100">
    <p class="text-center">Copyright © 2025 - MioBook</p>
</footer>
</body>
</html>
