spring.application.name=mio-book
server.servlet.context-path=/api

# ========== DATABASE CONFIG (MySQL) ==========
spring.datasource.url=jdbc:mysql://localhost:3306/mio_book_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234

# # Optional: Specify the driver explicitly (Spring Boot often auto-detects this)
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== JPA / HIBERNATE CONFIG ==========
spring.jpa.hibernate.ddl-auto=update

# Show generated SQL in logs
# spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MySQL dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=5000